<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FamiliApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f4f5; }
        .card-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.04), 0 4px 6px -2px rgba(0, 0, 0, 0.02); }
        .hidden { display: none !important; }
    </style>
</head>
<body class="antialiased min-h-screen">

    <!-- LOGIN -->
    <div id="login-container" class="flex flex-col items-center justify-center min-h-screen p-5 bg-white">
        <div class="bg-white p-8 rounded-[2.5rem] card-shadow border border-gray-100 text-center max-w-sm w-full">
            <h1 class="text-3xl font-black mb-8">FamiliApp</h1>
            <button onclick="loginWithGoogle()" class="w-full bg-black text-white font-bold py-4 px-4 rounded-2xl flex items-center justify-center gap-3">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6"> Ingresar con Google
            </button>
            <p id="login-error" class="text-red-500 text-sm mt-4 hidden font-bold"></p>
        </div>
    </div>

    <!-- APP -->
    <main id="app-container" class="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between gap-4 hidden">
        <header class="flex flex-col gap-2">
            <div class="flex justify-between items-center px-1">
                <span class="text-[0.65rem] font-black text-gray-400 tracking-widest uppercase">FamiliApp</span>
                <button onclick="logout()" class="bg-white text-red-500 p-2 rounded-xl card-shadow"><i data-lucide="log-out" class="w-4 h-4"></i></button>
            </div>
            <div class="flex items-center justify-between bg-white px-4 py-3 rounded-[2rem] card-shadow border border-gray-100">
                <button onclick="changeDate(-1)" class="p-2 text-gray-600"><i data-lucide="chevron-left"></i></button>
                <div class="text-center cursor-pointer">
                    <span id="current-date-display" class="text-lg font-black text-gray-800 capitalize">...</span>
                    <input type="date" id="global-date-selector" onchange="onDateChanged()" class="hidden">
                </div>
                <button onclick="changeDate(1)" class="p-2 text-gray-600"><i data-lucide="chevron-right"></i></button>
            </div>
        </header>

        <section id="alert-banner" class="hidden"></section>

        <!-- CLIMA -->
        <section class="bg-white rounded-[2rem] p-4 card-shadow flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div id="weather-icon-container" class="w-10 h-10 bg-blue-50 rounded-2xl flex items-center justify-center text-blue-500"><i data-lucide="sun" class="w-5 h-5"></i></div>
                <p id="weather-desc" class="text-gray-800 text-md font-black">Cargando...</p>
            </div>
            <div class="flex gap-3 text-lg font-black"><span class="text-red-500" id="temp-max">--°</span><span class="text-blue-500" id="temp-min">--°</span></div>
        </section>

        <!-- AVATARES -->
        <section class="grid grid-cols-2 gap-3 flex-1 min-h-0">
            <div class="bg-white rounded-[2rem] overflow-hidden card-shadow flex flex-col">
                <img id="img-pipe" src="pipe_normal.png" class="w-full h-[30vh] object-cover object-top">
                <div class="p-3 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="text-[0.6rem] font-black text-blue-800 uppercase">Primaria</h3>
                        <div id="menu-pipe" class="text-xs font-bold text-gray-800 mt-1">...</div>
                    </div>
                    <div id="specials-pipe" class="mt-2 border-t pt-2 hidden"></div>
                </div>
            </div>
            <div class="bg-white rounded-[2rem] overflow-hidden card-shadow flex flex-col">
                <img id="img-pili" src="pili_normal.png" class="w-full h-[30vh] object-cover object-top">
                <div class="p-3 flex-1 flex flex-col justify-between">
                    <div>
                        <h3 class="text-[0.6rem] font-black text-pink-700 uppercase">Jardín</h3>
                        <div id="menu-pili" class="text-xs font-bold text-gray-800 mt-1">...</div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="flex-shrink-0">
            <button onclick="toggleFutureEvents()" class="w-full bg-white font-bold py-3 px-6 rounded-[2rem] card-shadow flex items-center justify-between">
                Ver Agenda Completa <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </footer>
    </main>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDGI5P_DT4dD60MjT2vq_qyEh2rH0J8bY0", authDomain: "familiapp-aa48d.firebaseapp.com", projectId: "familiapp-aa48d", storageBucket: "familiapp-aa48d.firebasestorage.app", messagingSenderId: "898854281124", appId: "1:898854281124:web:9bffe249bb3249deffeb31" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const ALLOWED = ['florenciabressan@gmail.com', 'joselanglois@gmail.com'];

        auth.onAuthStateChanged(user => {
            if(user && ALLOWED.includes(user.email)) {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').classList.remove('hidden');
                initApp();
            }
        });

        async function loginWithGoogle() { await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        function logout() { auth.signOut(); location.reload(); }

        function initApp() {
            document.getElementById('global-date-selector').value = new Date().toISOString().split('T')[0];
            onDateChanged();
            fetchWeather();
            lucide.createIcons();
        }

        async function onDateChanged() {
            const date = document.getElementById('global-date-selector').value;
            document.getElementById('current-date-display').innerText = new Intl.DateTimeFormat('es-AR', { weekday: 'long', day: 'numeric', month: 'short' }).format(new Date(date + 'T00:00:00'));
            
            // Menú
            const doc = await db.collection("menus_diarios").doc(date).get();
            document.getElementById('menu-pipe').innerText = doc.exists ? doc.data().pipe : "Sin menú";
            document.getElementById('menu-pili').innerText = doc.exists ? doc.data().pili : "Sin menú";
            
            // Materias (Lunes=1, Miercoles=3, Viernes=5)
            const day = new Date(date + 'T00:00:00').getDay();
            const spec = document.getElementById('specials-pipe');
            if(day==1) spec.innerHTML = "⚽ Botines Fútbol", spec.classList.remove('hidden');
            else if(day==3 || day==5) spec.innerHTML = "🎨 Plástica", spec.classList.remove('hidden');
            else spec.classList.add('hidden');
        }

        async function fetchWeather() {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=-34.6370&longitude=-58.5231&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=America/Argentina/Buenos_Aires`);
            const data = await res.json();
            const temp = Math.round(data.current_weather.temperature);
            document.getElementById('weather-desc').innerText = temp + '°C';
            document.getElementById('temp-max').innerText = Math.round(data.daily.temperature_2m_max[0]) + '°';
            document.getElementById('temp-min').innerText = Math.round(data.daily.temperature_2m_min[0]) + '°';
            
            let s = temp < 12 ? 'mucho_frio' : (temp < 18 ? 'frio' : 'normal');
            document.getElementById('img-pipe').src = `pipe_${s}.png`;
            document.getElementById('img-pili').src = `pili_${s}.png`;
        }

        function changeDate(off) {
            let d = new Date(document.getElementById('global-date-selector').value + 'T00:00:00');
            d.setDate(d.getDate() + off);
            document.getElementById('global-date-selector').value = d.toISOString().split('T')[0];
            onDateChanged();
        }
    </script>
</body>
</html>
